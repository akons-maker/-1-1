<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나의 영화 티어리스트</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f6f5f2;--surface:#ffffff;--text:#1c1b19;--muted:#6b6862;--line:#e3e0d9;
  --s:#e5484d;--a:#f08a24;--b:#e5b800;--c:#3e9b6b;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141413;--surface:#1f1e1c;--text:#f1efea;--muted:#a09c94;--line:#33312e;
    --s:#ff6b6f;--a:#ffa04a;--b:#f2c92e;--c:#58c58f;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141413;--surface:#1f1e1c;--text:#f1efea;--muted:#a09c94;--line:#33312e;
  --s:#ff6b6f;--a:#ffa04a;--b:#f2c92e;--c:#58c58f;color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;line-height:1.4}
main{max-width:1000px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:clamp(1.6rem,5vw,2.4rem);margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 24px;font-size:.95rem}
.tier{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px}
.label{flex:0 0 64px;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:800;color:#fff;background:var(--tc)}
.cards{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;padding:12px}
.card{margin:0}
.poster{aspect-ratio:2/3;border-radius:8px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;
  color:#fff;background:linear-gradient(160deg,hsl(var(--h) 55% 38%),hsl(calc(var(--h) + 40) 60% 20%));
  border-bottom:4px solid var(--tc);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.poster small{opacity:.8;font-size:.7rem}
.poster b{font-size:.9rem;line-height:1.25;word-break:keep-all}
.title{margin-top:6px;font-size:.82rem;font-weight:600;text-align:center;word-break:keep-all}
@media (max-width:520px){
  .label{flex-basis:44px;font-size:1.5rem}
  .cards{grid-template-columns:repeat(3,1fr);gap:8px;padding:10px}
}
</style>
</head>
<body>
<main>
  <h1>나의 영화 티어리스트</h1>
  <p class="sub">1990년대 이후 영화 20편 · S → C</p>
  <div id="list"></div>
</main>
<script>
const TIERS=[
 {t:"S",c:"var(--s)",m:[["기생충",2019],["올드보이",2003],["인터스텔라",2014],["쇼생크 탈출",1994]]},
 {t:"A",c:"var(--a)",m:[["매트릭스",1999],["인셉션",2010],["파이트 클럽",1999],["센과 치히로의 행방불명",2001],["살인의 추억",2003],["다크 나이트",2008]]},
 {t:"B",c:"var(--b)",m:[["라라랜드",2016],["어바웃 타임",2013],["마션",2015],["조커",2019],["트루먼 쇼",1998],["어벤져스: 엔드게임",2019]]},
 {t:"C",c:"var(--c)",m:[["아바타",2009],["트랜스포머",2007],["캐리비안의 해적",2003],["미션 임파서블 2",2000]]}
];
let n=0;
const root=document.getElementById("list");
TIERS.forEach(({t,c,m})=>{
  const row=document.createElement("section");
  row.className="tier";row.style.setProperty("--tc",c);
  row.innerHTML='<div class="label">'+t+'</div><div class="cards">'+
    m.map(([name,yr])=>{
      const h=(n++*47+210)%360;
      return '<figure class="card"><div class="poster" style="--h:'+h+'"><small>'+yr+'</small><b>'+name+'</b></div><figcaption class="title">'+name+'</figcaption></figure>';
    }).join("")+'</div>';
  root.appendChild(row);
});
</script>
</body>
</html>
