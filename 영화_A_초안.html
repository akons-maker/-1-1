<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>나의 영화 티어리스트</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --card: #1f2937;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --s: #f59e0b;
        --a: #ef4444;
        --b: #3b82f6;
        --c: #10b981;
        --shadow: rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: linear-gradient(180deg, #0b1120 0%, #111827 100%);
        color: var(--text);
        font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      }

      .page {
        max-width: 1400px;
        margin: 0 auto;
        padding: 36px 20px 60px;
      }

      .header {
        text-align: center;
        margin-bottom: 32px;
      }

      .header h1 {
        margin: 0 0 10px;
        font-size: clamp(2rem, 3vw, 3rem);
        letter-spacing: -0.05em;
      }

      .header p {
        margin: 0;
        color: var(--muted);
        font-size: 0.98rem;
      }

      .tier-section {
        margin-top: 30px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 20px;
        background: rgba(15, 23, 42, 0.4);
        padding: 18px 18px 20px;
        transition: border-color 0.2s ease, transform 0.2s ease;
      }

      .tier-section.dragover {
        border-color: rgba(255, 255, 255, 0.45);
        transform: scale(1.01);
      }

      .tier-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
        cursor: grab;
        user-select: none;
      }

      .tier-header:active {
        cursor: grabbing;
      }

      .tier-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 54px;
        height: 54px;
        border-radius: 16px;
        font-weight: 800;
        font-size: 1.3rem;
        color: #fff;
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.24);
      }

      .tier-header h2 {
        margin: 0;
        font-size: clamp(1.2rem, 2vw, 1.7rem);
      }

      .movie-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 20px;
        min-height: 120px;
      }

      .movie-card {
        background: rgba(31, 41, 55, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 18px 30px var(--shadow);
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        cursor: grab;
      }

      .movie-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 26px 38px rgba(0, 0, 0, 0.4);
      }

      .movie-card.dragging {
        opacity: 0.45;
        transform: scale(0.98);
        border-color: rgba(255, 255, 255, 0.5);
      }

      .poster {
        position: relative;
        height: 260px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background-size: cover;
        background-position: center;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .poster::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          rgba(15, 23, 42, 0.16) 0%,
          rgba(15, 23, 42, 0.72) 100%
        );
      }

      .poster-title {
        position: relative;
        z-index: 1;
        display: block;
        width: 100%;
        text-align: center;
        font-size: clamp(1.1rem, 1.8vw, 1.5rem);
        font-weight: 800;
        line-height: 1.25;
        letter-spacing: -0.03em;
        text-shadow: 0 4px 10px rgba(0, 0, 0, 0.45);
      }

      .movie-name {
        padding: 12px 14px 16px;
        text-align: center;
        font-weight: 700;
        font-size: 0.96rem;
        color: var(--text);
        min-height: 48px;
      }

      .s-tier .tier-badge { background: linear-gradient(135deg, #f59e0b, #fbbf24); }
      .a-tier .tier-badge { background: linear-gradient(135deg, #ef4444, #f97316); }
      .b-tier .tier-badge { background: linear-gradient(135deg, #3b82f6, #60a5fa); }
      .c-tier .tier-badge { background: linear-gradient(135deg, #10b981, #34d399); }

      @media (max-width: 768px) {
        .page {
          padding-left: 14px;
          padding-right: 14px;
        }

        .movie-grid {
          grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
          gap: 14px;
        }

        .poster {
          height: 220px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <h1>나의 영화 티어리스트</h1>
        <p>1990년대 이후 영화 20편을 티어별로 정리한 개인용 추천 목록</p>
      </header>

      <main id="app"></main>
    </div>

    <script>
      const movies = [
        { title: '인셉션', tier: 'S', colors: ['#1d4ed8', '#38bdf8'] },
        { title: '인터스텔라', tier: 'S', colors: ['#0f172a', '#7c3aed'] },
        { title: '기생충', tier: 'S', colors: ['#0f766e', '#22c55e'] },
        { title: '올드보이', tier: 'S', colors: ['#0b1120', '#f97316'] },
        { title: '쇼생크 탈출', tier: 'S', colors: ['#1f2937', '#a78bfa'] },

        { title: '매트릭스', tier: 'A', colors: ['#111827', '#06b6d4'] },
        { title: '라라랜드', tier: 'A', colors: ['#7c2d12', '#f59e0b'] },
        { title: '포레스트 검프', tier: 'A', colors: ['#1e293b', '#22c55e'] },
        { title: '조커', tier: 'A', colors: ['#111827', '#f43f5e'] },
        { title: '센과 치히로의 행방불명', tier: 'A', colors: ['#0f172a', '#38bdf8'] },

        { title: '타이타닉', tier: 'B', colors: ['#0f172a', '#60a5fa'] },
        { title: '어벤져스: 엔드게임', tier: 'B', colors: ['#111827', '#ef4444'] },
        { title: '스파이더맨: 노 웨이 홈', tier: 'B', colors: ['#1e3a8a', '#f59e0b'] },
        { title: '오펜하이머', tier: 'B', colors: ['#111827', '#f97316'] },
        { title: '아이언맨', tier: 'B', colors: ['#172554', '#facc15'] },

        { title: '인사이드 아웃', tier: 'C', colors: ['#1d4ed8', '#a78bfa'] },
        { title: '글래디에이터', tier: 'C', colors: ['#4c1d95', '#f59e0b'] },
        { title: '살인의 추억', tier: 'C', colors: ['#111827', '#9ca3af'] },
        { title: '드라이브 마이 카', tier: 'C', colors: ['#0f172a', '#10b981'] },
        { title: '엣지 오브 투모로우', tier: 'C', colors: ['#1e293b', '#22d3ee'] }
      ];

      const tierOrder = ['S', 'A', 'B', 'C'];
      const app = document.getElementById('app');

      function makePoster(title, colors) {
        const [start, end] = colors;
        const svg = `
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" width="300" height="360">
            <defs>
              <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="${start}" />
                <stop offset="100%" stop-color="${end}" />
              </linearGradient>
            </defs>
            <rect width="300" height="360" fill="url(#g)"/>
            <circle cx="225" cy="80" r="72" fill="rgba(255,255,255,0.12)"/>
            <circle cx="70" cy="260" r="90" fill="rgba(255,255,255,0.08)"/>
            <rect x="28" y="28" width="244" height="304" rx="18" fill="rgba(15, 23, 42, 0.16)" stroke="rgba(255,255,255,0.18)"/>
            <text x="150" y="170" text-anchor="middle" fill="white" font-size="28" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-weight="700" letter-spacing="-1">${title}</text>
          </svg>
        `;

        const encoded = encodeURIComponent(svg)
          .replace(/%0A/g, '')
          .replace(/%20/g, ' ');

        return `data:image/svg+xml;charset=UTF-8,${encoded}`;
      }

      function render() {
        app.innerHTML = '';

        tierOrder.forEach((tier) => {
          const moviesInTier = movies.filter((movie) => movie.tier === tier);

          const section = document.createElement('section');
          section.className = `tier-section ${tier.toLowerCase()}-tier`;
          section.dataset.tier = tier;
          section.innerHTML = `
            <div class="tier-header" draggable="true" data-tier="${tier}">
              <div class="tier-badge">${tier}</div>
              <h2>${tier} 티어</h2>
            </div>
            <div class="movie-grid" data-tier="${tier}"></div>
          `;

          const grid = section.querySelector('.movie-grid');

          moviesInTier.forEach((movie) => {
            const card = document.createElement('article');
            card.className = 'movie-card';
            card.draggable = true;
            card.dataset.title = movie.title;
            card.dataset.tier = movie.tier;
            card.innerHTML = `
              <div class="poster" style="background-image: url('${makePoster(movie.title, movie.colors)}');">
                <span class="poster-title">${movie.title}</span>
              </div>
              <div class="movie-name">${movie.title}</div>
            `;

            card.addEventListener('dragstart', (event) => {
              const title = event.currentTarget.dataset.title;
              event.dataTransfer.effectAllowed = 'move';
              event.dataTransfer.setData('text/plain', title);
              event.currentTarget.classList.add('dragging');
            });

            card.addEventListener('dragend', (event) => {
              event.currentTarget.classList.remove('dragging');
              document.querySelectorAll('.tier-section').forEach((el) => el.classList.remove('dragover'));
            });

            grid.appendChild(card);
          });

          section.addEventListener('dragover', (event) => {
            event.preventDefault();
            event.dataTransfer.dropEffect = 'move';
            section.classList.add('dragover');
          });

          section.addEventListener('dragleave', () => {
            section.classList.remove('dragover');
          });

          section.addEventListener('drop', (event) => {
            event.preventDefault();
            section.classList.remove('dragover');

            const title = event.dataTransfer.getData('text/plain');
            if (!title) return;

            const sourceMovie = movies.find((movie) => movie.title === title);
            if (!sourceMovie) return;

            const targetTier = section.dataset.tier;
            if (sourceMovie.tier !== targetTier) {
              sourceMovie.tier = targetTier;
            }

            render();
          });

          const tierHeader = section.querySelector('.tier-header');
          tierHeader.addEventListener('dragstart', (event) => {
            event.dataTransfer.setData('text/tier', tier);
            event.dataTransfer.effectAllowed = 'move';
          });

          tierHeader.addEventListener('dragover', (event) => {
            event.preventDefault();
          });

          tierHeader.addEventListener('drop', (event) => {
            event.preventDefault();
            const draggedTier = event.dataTransfer.getData('text/tier');
            if (!draggedTier || draggedTier === tier) return;

            const fromIndex = tierOrder.indexOf(draggedTier);
            const toIndex = tierOrder.indexOf(tier);
            if (fromIndex === -1 || toIndex === -1) return;

            const [moved] = tierOrder.splice(fromIndex, 1);
            tierOrder.splice(toIndex, 0, moved);
            render();
          });

          app.appendChild(section);
        });
      }

      render();
    </script>
  </body>
</html>
